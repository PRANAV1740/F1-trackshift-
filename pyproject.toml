[project]
name = "race-intelligence"
version = "0.1.0"
description = "TrackShift 2026 -- simulator-independent, real-time race intelligence engine."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

# Grouped by the phase that first needs them (see docs/ARCHITECTURE.md
# "Development Roadmap"), so `pip install -e .` stays light until a phase
# actually requires the extra weight. numpy graduated to a core dependency
# in Phase 5 (backend/tyre's regression needs real linear-algebra, not a
# hand-rolled matrix solver) -- everything else here is still opt-in.
[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
ml = [
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
realtime = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "models*", "simulator*", "radio*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.api.app:app"

